[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "introvertensemble"
version = "0.1.0"
description = "Environment spec and simulator foundation for the library seating MARL project."
readme = "LIBRARY_MARL_RESEARCH_PLAN.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10,<12",
  "pygame>=2.6,<3",
  "numpy>=1.24",
  "gymnasium>=0.29",
]

[project.optional-dependencies]
rl = [
  "stable-baselines3>=2.3,<3",
  "torch>=2.0",
  "tensorboard>=2.14",
  "tqdm>=4.66",
  "rich>=13.0",
]
marl = [
  "pettingzoo>=1.24",
  "ray[rllib]>=2.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
