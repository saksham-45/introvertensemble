[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "introvertensemble"
version = "0.1.0"
description = "Environment spec and simulator foundation for the library seating MARL project."
readme = "LIBRARY_MARL_RESEARCH_PLAN.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10,<12",
  "pygame>=2.6,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
