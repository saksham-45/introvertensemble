[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "introvertensemble"
version = "0.1.0"
description = "Environment spec and simulator foundation for the library seating MARL project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10,<12",
  "pygame>=2.6,<3",
  "numpy>=1.24",
  "gymnasium>=0.29",
]

[project.optional-dependencies]
rl = [
  "stable-baselines3>=2.3,<3",
  "torch>=2.0",
  "tensorboard>=2.14",
  "tqdm>=4.66",
  "rich>=13.0",
]
marl = [
  "pettingzoo>=1.24",
  "ray[rllib]>=2.9",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
# Reporting extras for the hardened evaluation harness (IQM + bootstrap CIs).
report = [
  "rliable>=1.0.8",
  "pandas>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long lines are tolerated in this research code

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
